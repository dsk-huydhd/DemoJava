plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id "org.sonarqube" version "6.2.0.5505"
}

sonar {
  properties {
    // For cloud
    property "sonar.projectKey", "dsk-huydhd_DemoJava"
    property "sonar.organization", "dsk-huydhd"
    property "sonar.host.url", "https://sonarcloud.io"

    // For local
    // property "sonar.projectKey", "demo-java"
    // property "sonar.projectName", "demo-java"
    // property "sonar.host.url", "http://localhost:9000"
    // property "sonar.token", "sqp_9de03a68db351a056e5ca74d5689c229468214ef"
  }
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'demojava.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
